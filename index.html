<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <div class="titlebar">
        <div class="title">Calculator</div>
      </div>

      <div class="calculator">
        <div class="display">
          <div class="expression"></div>
          <div class="result">0</div>
        </div>

        <div class="buttons">
          <button class="function">AC</button>
          <button class="function">+/-</button>
          <button class="function">%</button>
          <button class="operator">÷</button>

          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button class="operator">×</button>

          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button class="operator">−</button>

          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button class="operator">+</button>

          <button class="zero">0</button>
          <button>.</button>
          <button class="operator equals">=</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
